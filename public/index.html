<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Care Academy</title>
<style>
:root{--p:#2563eb;--p2:#1d4ed8;--bg:#f6f8fc;--card:#fff;--text:#132238;--muted:#68758a;--line:#e4e9f1;--danger:#dc2626;--ok:#15803d;--warn:#b45309;--shadow:0 12px 35px rgba(15,23,42,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.brand span{color:var(--p)}.topright{display:flex;align-items:center;gap:10px}.shell{display:flex;min-height:calc(100vh - 66px)}aside{width:250px;background:#0f172a;color:#e6eefc;padding:18px 14px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}.side-section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#93a4c5;margin:16px 10px 8px}.navbtn{width:100%;background:transparent;color:#d7e1f2;border:0;text-align:left;padding:10px 12px;border-radius:12px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#1e293b;color:#fff}.main{flex:1;padding:24px;max-width:1500px;margin:auto;width:100%}.page-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.page-title h1{margin:0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat{font-size:30px;font-weight:800;margin-top:6px}.small{font-size:12px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#edf2ff;color:#2847a0;font-size:12px;font-weight:700}.badge.ok{background:#eaf8ef;color:var(--ok)}.badge.warn{background:#fff7e7;color:var(--warn)}.badge.danger{background:#fff0f0;color:var(--danger)}
.btn{border:0;background:var(--p);color:#fff;padding:10px 14px;border-radius:11px;font-weight:700}.btn:hover{background:var(--p2)}.btn.alt{background:#edf2f8;color:#1e293b}.btn.danger{background:var(--danger)}.btn.ok{background:var(--ok)}.btn.sm{padding:7px 10px;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.form{display:grid;gap:10px}.form.grid2{grid-template-columns:1fr 1fr}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#516176}.field input,.field select,.field textarea{border:1px solid #d8dee9;padding:11px 12px;border-radius:11px;background:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#9bb0ff;box-shadow:0 0 0 3px rgba(37,99,235,.08)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.table th{color:#5b6b82;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.empty{padding:28px;text-align:center;color:var(--muted)}.notice-card{border-left:4px solid var(--p)}.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow)}
.login-bg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef4ff,#fdfcff)}.login-card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.12)}.login-card h1{margin:0 0 6px}.logo-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--p);color:#fff;font-weight:900;margin-bottom:16px}.public-wrap{min-height:100vh}.hero{padding:72px 24px;text-align:center;background:radial-gradient(circle at top,#eaf1ff,transparent 55%)}.hero h1{font-size:clamp(34px,6vw,66px);margin:0 0 14px}.hero p{max-width:750px;margin:0 auto 24px;color:var(--muted);font-size:18px}.public-nav{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.public-nav .links{display:flex;gap:8px}.public-section{max-width:1100px;margin:auto;padding:28px 24px}.footer{padding:34px 24px 40px;text-align:center}.tsn-badge{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;font-size:14px;letter-spacing:.08em;box-shadow:0 8px 22px rgba(37,99,235,.22);border:1px solid rgba(255,255,255,.55)}.tsn-badge:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(37,99,235,.28)}.checkbox{display:flex;align-items:center;gap:8px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}aside{width:220px}}@media(max-width:760px){.shell{display:block}aside{position:static;width:100%;height:auto;display:flex;gap:6px;overflow:auto}.side-section{display:none}.navbtn{width:auto;white-space:nowrap}.main{padding:16px}.top{padding:0 14px}.top .email{display:none}.grid,.grid3{grid-template-columns:1fr}.form.grid2{grid-template-columns:1fr}.public-nav .links{display:none}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const state={user:null,view:'dashboard',setup:false,cache:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});
async function api(url,opt={}){const r=await fetch('/api'+url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Request failed');return j}
function toast(msg){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast hidden';document.body.appendChild(t)}t.textContent=String(msg||'');t.classList.remove('hidden');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.add('hidden'),3200)}
async function boot(){try{const s=await api('/setup/status');if(s.needsAdmin){state.setup=true;renderSetup();return}const me=await api('/me');state.user=me.user;render()}catch{renderPublic()}}
function renderSetup(){document.body.innerHTML=`<div class="login-bg"><div class="login-card"><div class="logo-mark">SCA</div><h1>First Admin Setup</h1><p class="muted">Create the first academy administrator. No default credentials are stored.</p><form class="form" onsubmit="return setupAdmin(event)"><div class="field"><label>Full Name</label><input id="sn" required autocomplete="name"></div><div class="field"><label>Email</label><input id="se" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="sp" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm Password</label><input id="sc" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" type="submit">Create Admin</button></form><p class="small muted">Student Care Academy · Boyra, 23 No. Road, Khulna</p></div></div><div id="toast" class="toast hidden"></div>`}
async function setupAdmin(e){e.preventDefault();const b=e.submitter||e.target.querySelector('button');try{if(b)b.disabled=true;const name=$('sn').value.trim(),email=$('se').value.trim(),password=$('sp').value,confirm=$('sc').value;if(password.length<8)throw Error('Password must be at least 8 characters.');if(password!==confirm)throw Error('Password and Confirm Password do not match.');await api('/setup/admin',{method:'POST',body:JSON.stringify({name,email,password,confirm})});toast('Admin created successfully. Opening Admin Login...');setTimeout(()=>renderLogin('admin'),700)}catch(err){toast(err.message||'Could not create admin.')}finally{if(b)b.disabled=false}return false}
function renderPublic(){document.body.innerHTML=`<div class="public-wrap"><div class="public-nav"><div class="brand">Student Care <span>Academy</span></div><div class="links"><button class="btn alt" onclick="renderLogin('student')">Student Login</button><button class="btn alt" onclick="renderLogin('parent')">Parent Login</button><button class="btn alt" onclick="renderLogin('teacher')">Teacher Login</button><button class="btn" onclick="renderLogin('admin')">Admin Login</button></div></div><section class="hero"><h1>Student Care Academy</h1><p>Secure coaching management portal for students, parents, teachers and administrators.</p><div class="row" style="justify-content:center"><button class="btn" onclick="renderLogin('student')">Student Portal</button><button class="btn alt" onclick="renderLogin('parent')">Parent Portal</button></div></section><section class="public-section grid3"><div class="card"><h3>About Us</h3><p class="muted">A focused academic management system for results, attendance, fees, routines, notices and communication.</p></div><div class="card"><h3>Secure Access</h3><p class="muted">Public pages do not expose private student data. Authenticated areas are role protected.</p></div><div class="card"><h3>Contact</h3><p class="muted"><a href="tel:+8801760222201" style="color:inherit;text-decoration:underline;font-weight:800">01760222201</a><br>Boyra, 23 No. Road, Khulna</p></div></section><div class="footer"><span class="tsn-badge">Made by TSN</span></div></div>`}
function renderLogin(role){document.body.innerHTML=`<div class="login-bg"><div class="login-card"><div class="logo-mark">SCA</div><h1>${role[0].toUpperCase()+role.slice(1)} Login</h1><p class="muted">Student Care Academy · ${role}</p><form class="form" onsubmit="return doLogin(event,'${role}')"><div class="field"><label>Email</label><input id="le" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="lp" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in</button></form><br><button class="btn alt" onclick="renderPublic()">Back to website</button></div></div><div id="toast" class="toast hidden"></div>`}
async function doLogin(e,role){e.preventDefault();try{const j=await api('/login',{method:'POST',body:JSON.stringify({email:$('le').value,password:$('lp').value,role})});state.user=j.user;state.view='dashboard';render();}catch(e){toast(e.message)}return false}
function navItems(){const r=state.user.role;let a=[['dashboard','Dashboard']];if(r==='admin')a=a.concat([['users','Users'],['students','Students'],['classes','Classes & Sections'],['subjects','Subjects'],['attendance','Attendance'],['results','Results'],['fees','Fees & Due'],['payments','Payments'],['routines','Routines'],['notices','Notices'],['materials','Materials'],['assignments','Assignments'],['report','Academy Report'],['audit','Audit Logs']]);if(r==='teacher')a=a.concat([['students','Students'],['attendance','Attendance'],['results','Results'],['routines','Routines'],['notices','Notices'],['materials','Materials'],['assignments','Assignments'],['notifications','Notifications']]);if(r==='student'||r==='parent')a=a.concat([['profile','Profile'],['results','My Results'],['attendance','Attendance'],['fees','Fee & Due'],['payments','Payments'],['routines','Routines'],['notices','Notices'],['notifications','Notifications'],['materials','Materials'],['assignments','Assignments']]);return a}
function render(){document.body.innerHTML=`<div class="top"><div class="brand">Student Care <span>Academy</span></div><div class="topright"><button class="btn alt sm" onclick="toggleDark()">Theme</button><span class="email">${esc(state.user.name)} · ${esc(state.user.role)}${state.user.is_main_admin?" · Main Admin":""}</span><button class="btn sm" onclick="logout()">Logout</button></div></div><div class="shell"><aside>${navItems().map(([id,label])=>`<button class="navbtn ${state.view===id?'active':''}" onclick="state.view='${id}';render()">${esc(label)}<span id="nb-${id}"></span></button>`).join('')}<div class="side-section">Academy</div><div class="small muted" style="padding:0 10px;color:#9fb0c9"><a href="tel:+8801760222201" style="color:inherit;text-decoration:underline;font-weight:800">01760222201</a><br>Boyra, 23 No. Road, Khulna</div><div style="padding:16px 10px"><span class="tsn-badge" style="font-size:12px;padding:8px 13px;letter-spacing:.06em">Made by TSN</span></div></aside><main class="main" id="main"></main></div>`;page(state.view)}
async function logout(){await api('/logout',{method:'POST'});state.user=null;renderPublic()}
function toggleDark(){document.body.classList.toggle('dark');if(document.body.classList.contains('dark'))document.documentElement.style.setProperty('--bg','#0b1220'),document.documentElement.style.setProperty('--card','#111827'),document.documentElement.style.setProperty('--text','#e5edf8'),document.documentElement.style.setProperty('--line','#233047');else location.reload()}
async function page(v){const m=$('main');try{if(v==='dashboard')return dash(m);if(v==='profile')return profile(m);if(v==='users')return users(m);if(v==='students')return students(m);if(v==='classes')return classes(m);if(v==='subjects')return subjects(m);if(v==='attendance')return attendance(m);if(v==='results')return results(m);if(v==='fees')return fees(m);if(v==='payments')return payments(m);if(v==='routines')return routines(m);if(v==='notices')return notices(m);if(v==='notifications')return notifications(m);if(v==='materials')return materials(m);if(v==='assignments')return assignments(m);if(v==='report')return report(m);if(v==='audit')return auditPage(m);m.innerHTML='<div class="card empty">Module not found.</div>'}catch(e){m.innerHTML=`<div class="card"><h3>Error</h3><p>${esc(e.message)}</p></div>`}}
async function dash(m){const d=await api('/dashboard');let cards=state.user.role==='admin'?[['Students',d.students],['Teachers',d.teachers],['Parents',d.parents],['Pending Payments',d.pendingPayments],['Total Due',money(d.due)]]:state.user.role==='teacher'?[['Students',(await api('/students')).length],['Unread Notifications',d.unread],['Quick Access','Results / Attendance']]:[['My Children / Profile',d.students],['Current Due',money(d.due)],['Payments',d.payments],['Unread Notifications',d.unread]];m.innerHTML=`<div class="page-title"><div><h1>Dashboard</h1><p class="muted">Welcome back, ${esc(state.user.name)}.</p></div></div><div class="grid">${cards.map(c=>`<div class="card"><div class="muted small">${esc(c[0])}</div><div class="stat">${esc(c[1])}</div></div>`).join('')}</div><br><div class="grid3"><div class="card"><h3>Quick actions</h3><div class="row">${state.user.role==='admin'?'<button class="btn sm" onclick="state.view=\'users\';render()">Add User</button><button class="btn sm" onclick="state.view=\'notices\';render()">Add Notice</button><button class="btn sm" onclick="state.view=\'payments\';render()">Payments</button>':state.user.role==='teacher'?'<button class="btn sm" onclick="state.view=\'attendance\';render()">Take Attendance</button><button class="btn sm" onclick="state.view=\'results\';render()">Enter Marks</button>':'<button class="btn sm" onclick="state.view=\'payments\';render()">Make Payment</button><button class="btn sm" onclick="state.view=\'results\';render()">View Result</button>'}</div></div><div class="card"><h3>Private by design</h3><p class="muted">Results, routines, notices, fees and notifications are available only inside the appropriate authenticated portal.</p></div><div class="card"><h3>Contact</h3><p class="muted"><a href="tel:+8801760222201" style="color:inherit;text-decoration:underline;font-weight:800">01760222201</a><br>Boyra, 23 No. Road, Khulna</p></div></div>`}
async function profile(m){const s=await api('/students');m.innerHTML=`<div class="page-title"><h1>Profile</h1></div><div class="card"><div class="grid3"><div><div class="muted small">Name</div><b>${esc(state.user.name)}</b></div><div><div class="muted small">Email</div><b>${esc(state.user.email)}</b></div><div><div class="muted small">Role</div><span class="badge">${esc(state.user.role)}</span></div></div></div>${s.map(x=>`<br><div class="card"><h3>${esc(x.name)}</h3><p class="muted">Student ID: ${esc(x.student_id||'—')} · Class ${esc(x.class_no||'—')} · Section ${esc(x.section_name||'—')} · Roll ${esc(x.roll||'—')}</p></div>`).join('')}`}
async function users(m){const us=await api('/users');m.innerHTML=`<div class="page-title"><div><h1>User Management</h1><p class="muted">Admin can create Admin, Teacher, Student and Parent accounts.</p></div></div><div class="card"><form class="form grid2" onsubmit="return addUser(event)"><div class="field"><label>Full Name</label><input id="un" required></div><div class="field"><label>Email</label><input id="ue" type="email" required></div><div class="field"><label>Phone</label><input id="uph"></div><div class="field"><label>Role</label><select id="ur"><option>admin</option><option>teacher</option><option>student</option><option>parent</option></select></div><div class="field"><label>Password</label><input id="up" type="password" minlength="8" required></div><div class="field"><label>Teacher subject (optional)</label><input id="usub"></div><div class="field"><label>Designation (optional)</label><input id="udes"></div><button class="btn">Create User</button></form></div><br><div class="card table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span>${u.is_main_admin?'<span class="badge ok">Main Admin</span>':''}</td><td>${u.active?'<span class="badge ok">Active</span>':'<span class="badge danger">Inactive</span>'}</td><td>${u.is_main_admin && u.id!==state.user.id?'<span class="badge ok">Protected</span>':'<button class="btn alt sm" onclick="toggleUser('+u.id+','+(!u.active)+')">'+(u.active?'Deactivate':'Activate')+'</button> <button class="btn alt sm" onclick="resetPwd('+u.id+')">Reset password</button>'}</td></tr>`).join('')}</tbody></table></div>`}
async function addUser(e){e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify({name:$('un').value,email:$('ue').value,phone:$('uph').value,password:$('up').value,role:$('ur').value,subject:$('usub').value,designation:$('udes').value})});toast('User created');users($('main'))}catch(e){toast(e.message)}return false}
async function toggleUser(id,active){try{await api('/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({active})});users($('main'))}catch(e){toast(e.message)}}async function resetPwd(id){const p=prompt('Enter a new password (8+ characters):');if(!p)return;try{await api('/users/'+id+'/password',{method:'PATCH',body:JSON.stringify({password:p})});toast('Password updated')}catch(e){toast(e.message)}}
async function students(m){const [ss,cs]=await Promise.all([api('/students'),api('/classes')]);m.innerHTML=`<div class="page-title"><h1>Students</h1></div>${state.user.role==='admin'?`<div class="card"><form class="form grid2" onsubmit="return addStudent(event)"><div class="field"><label>Name</label><input id="stn" required></div><div class="field"><label>Email</label><input id="ste" type="email" required></div><div class="field"><label>Password</label><input id="stp" type="password" minlength="8" required></div><div class="field"><label>Student ID</label><input id="stid" required></div><div class="field"><label>Class</label><select id="stc" onchange="loadSectionsFor('stc','sts')">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Section</label><select id="sts"></select></div><div class="field"><label>Roll</label><input id="str"></div><div class="field"><label>Phone</label><input id="stph"></div><div class="field"><label>Guardian phone</label><input id="stg"></div><div class="field"><label>Starting total fee</label><input id="stfee" type="number" min="0" step="0.01"></div><button class="btn">Add Student</button></form></div><br>`:''}<div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>ID</th><th>Class</th><th>Section</th><th>Roll</th><th>Status</th></tr></thead><tbody>${ss.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.student_id||'')}</td><td>${esc(s.class_name||'')}</td><td>${esc(s.section_name||'')}</td><td>${esc(s.roll||'')}</td><td>${s.active?'<span class="badge ok">Active</span>':'<span class="badge danger">Inactive</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No students found.</td></tr>'}</tbody></table></div>${state.user.role==='admin'?'': ''}`; if(state.user.role==='admin') setTimeout(()=>loadSectionsFor('stc','sts'),0)}
async function loadSectionsFor(cid,sid){const cs=state.cache.classes||(state.cache.classes=await api('/classes'));const c=cs.find(x=>String(x.id)===String($(cid)?.value));if($(sid))$(sid).innerHTML=(c?.sections||[]).filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
async function addStudent(e){e.preventDefault();try{await api('/students',{method:'POST',body:JSON.stringify({name:$('stn').value,email:$('ste').value,password:$('stp').value,student_id:$('stid').value,class_id:$('stc').value,section_id:$('sts').value,roll:$('str').value,phone:$('stph').value,guardian_phone:$('stg').value,total_fee:$('stfee').value})});toast('Student added');students($('main'))}catch(e){toast(e.message)}return false}
async function classes(m){const cs=await api('/classes');state.cache.classes=cs;m.innerHTML=`<div class="page-title"><div><h1>Classes & Sections</h1><p class="muted">Class 1–12 with multiple sections.</p></div></div><div class="grid3">${cs.map(c=>`<div class="card"><div class="row"><h3 class="grow">${esc(c.name)}</h3>${c.active?'<span class="badge ok">Active</span>':'<span class="badge danger">Inactive</span>'}</div><p class="muted">Sections</p><div class="row">${c.sections.map(s=>`<span class="badge">${esc(s.name)} ${s.active?'':'(inactive)'}</span>`).join('')||'<span class="muted">No sections</span>'}</div><br><div class="row"><button class="btn sm" onclick="addSection(${c.id})">Add Section</button><button class="btn alt sm" onclick="renameClass(${c.id},'${esc(c.name).replace(/'/g,"\\'")}')">Edit Class</button></div></div>`).join('')}</div>`}
async function addSection(id){const n=prompt('Section name:');if(!n)return;try{await api('/sections',{method:'POST',body:JSON.stringify({class_id:id,name:n})});classes($('main'))}catch(e){toast(e.message)}}async function renameClass(id,current){const n=prompt('Class name:',current);if(!n)return;try{await api('/classes/'+id,{method:'PATCH',body:JSON.stringify({name:n,active:true})});classes($('main'))}catch(e){toast(e.message)}}
async function subjects(m){const ss=await api('/subjects');m.innerHTML=`<div class="page-title"><h1>Subjects</h1></div><div class="card row"><input id="subn" class="grow" placeholder="Subject name"><button class="btn" onclick="addSubject()">Add Subject</button></div><br><div class="card"><div class="row">${ss.map(s=>`<span class="badge">${esc(s.name)}</span>`).join('')||'<span class="muted">No subjects yet.</span>'}</div></div>`}async function addSubject(){try{await api('/subjects',{method:'POST',body:JSON.stringify({name:$('subn').value})});subjects($('main'))}catch(e){toast(e.message)}}
async function attendance(m){const [ss,cs]=await Promise.all([api('/students'),api('/classes')]);const date=new Date().toISOString().slice(0,10);m.innerHTML=`<div class="page-title"><div><h1>Attendance</h1><p class="muted">Mark all, save, edit and review history.</p></div></div>${state.user.role==='admin'||state.user.role==='teacher'?`<div class="card"><form class="form" onsubmit="return saveAttendance(event)"><div class="row"><div class="field grow"><label>Date</label><input id="adate" type="date" value="${date}"></div><div class="field grow"><label>Class filter</label><select id="aclass"><option value="">All</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button type="button" class="btn alt" onclick="markAllAtt(true)">Mark All Present</button><button type="button" class="btn alt" onclick="markAllAtt(false)">Mark All Absent</button></div><div id="attlist">${ss.map(s=>`<label class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0" data-class="${s.class_id}"><span>${esc(s.name)} · ${esc(s.student_id)}</span><input type="checkbox" class="att" data-id="${s.id}" checked></label>`).join('')}</div><button class="btn">Save Attendance</button></form></div><br>`:''}<div class="card"><h3>Attendance history</h3><div id="att-history" class="empty">Loading…</div></div>`;filterAtt();$('aclass')?.addEventListener('change',filterAtt);loadAttendanceHistory()}
function filterAtt(){const f=$('aclass')?.value;document.querySelectorAll('#attlist [data-class]').forEach(x=>x.style.display=(!f||x.dataset.class===f)?'flex':'none')}
function markAllAtt(v){document.querySelectorAll('.att').forEach(x=>x.checked=v)}async function saveAttendance(e){e.preventDefault();const records=[...document.querySelectorAll('.att')].filter(x=>x.closest('[data-class]').style.display!=='none').map(x=>({student_id:x.dataset.id,present:x.checked}));try{await api('/attendance/bulk',{method:'POST',body:JSON.stringify({date:$('adate').value,records})});toast('Attendance saved');loadAttendanceHistory()}catch(e){toast(e.message)}return false}
async function loadAttendanceHistory(){const r=await api('/attendance');$('att-history').innerHTML=r.slice(0,80).map(x=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(x.date)} · ${esc(x.name)}</span><span class="badge ${x.present?'ok':'danger'}">${x.present?'Present':'Absent'}</span></div>`).join('')||'<div class="empty">No attendance records.</div>'}
async function results(m){const [rs,ss,ex,sub]=await Promise.all([api('/results'),api('/students'),api('/exams'),api('/subjects')]);m.innerHTML=`<div class="page-title"><div><h1>Results & Marksheet</h1><p class="muted">Digital marks + optional private result-card image (JPG/JPEG/PNG).</p></div></div>${state.user.role==='admin'||state.user.role==='teacher'?`<div class="card"><form class="form grid2" onsubmit="return saveResult(event)"><div class="field"><label>Student</label><select id="rsstu">${ss.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.student_id)}</option>`).join('')}</select></div><div class="field"><label>Exam</label><select id="rsexam">${ex.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select id="rssub">${sub.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Marks</label><input id="rmarks" type="number" min="0" step="0.01" required></div><div class="field"><label>Max Marks</label><input id="rmax" type="number" min="1" step="0.01" value="100"></div><label class="checkbox"><input id="rpub" type="checkbox" checked> Publish result</label><button class="btn">Save Result</button></form></div><br>`:''}<div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Exam</th><th>Subject</th><th>Marks</th><th>Grade</th><th>GPA</th><th>Status</th><th>Card</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.student_name)}<div class="small muted">${esc(r.sid)}</div></td><td>${esc(r.exam)}</td><td>${esc(r.subject)}</td><td>${r.marks}/${r.max_marks}</td><td>${esc(r.grade)}</td><td>${r.gpa}</td><td>${r.published?'<span class="badge ok">Published</span>':'<span class="badge warn">Unpublished</span>'}</td><td>${r.card_mime?`<button class="btn alt sm" onclick="viewCard(${r.id})">View image</button>`:state.user.role==='admin'||state.user.role==='teacher'?`<button class="btn alt sm" onclick="uploadCard(${r.id})">Upload image</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No results found.</td></tr>'}</tbody></table></div>`}
async function saveResult(e){e.preventDefault();try{await api('/results',{method:'POST',body:JSON.stringify({student_id:$('rsstu').value,exam_id:$('rsexam').value,subject_id:$('rssub').value,marks:$('rmarks').value,max_marks:$('rmax').value,published:$('rpub').checked})});toast('Result saved');results($('main'))}catch(e){toast(e.message)}return false}
function uploadCard(id){const i=document.createElement('input');i.type='file';i.accept='.jpg,.jpeg,.png,image/jpeg,image/png';i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>5*1024*1024)return toast('Maximum 5 MB');const rd=new FileReader();rd.onload=async()=>{try{await api('/results/'+id+'/card',{method:'POST',body:JSON.stringify({dataUrl:rd.result,name:f.name})});toast('Result card uploaded');results($('main'))}catch(e){toast(e.message)}};rd.readAsDataURL(f)};i.click()}
function viewCard(id){window.open('/api/results/'+id+'/card','_blank','noopener,noreferrer')}
async function fees(m){const fs=await api('/fees');m.innerHTML=`<div class="page-title"><div><h1>Fee & Due</h1><p class="muted">Due never goes below zero; adjustments are logged by the admin.</p></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Class</th><th>Total</th><th>Additional</th><th>Due</th>${state.user.role==='admin'?'<th>Action</th>':''}</tr></thead><tbody>${fs.map(f=>`<tr><td>${esc(f.student_name)}<div class="small muted">${esc(f.sid)}</div></td><td>${esc(f.class_no||'')}</td><td>${money(f.total_fee)}</td><td>${money(f.additional_charge)}</td><td><b>${money(f.due)}</b></td>${state.user.role==='admin'?`<td><button class="btn alt sm" onclick="adjustFee(${f.student_id},${f.total_fee},${f.due})">Adjust</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="empty">No fee records.</td></tr>'}</tbody></table></div>`}
async function adjustFee(id,total,due){const add=prompt('Additional charge (0 if none):','0');const adj=prompt('Manual adjustment (+ or -):','0');const reason=prompt('Reason:');if(add===null||adj===null)return;try{await api('/fees/'+id,{method:'PATCH',body:JSON.stringify({total_fee:total,additional_charge:add,adjustment:adj,adjustment_reason:reason||''})});toast('Fee updated');fees($('main'))}catch(e){toast(e.message)}}
async function payments(m){const ps=await api('/payments');m.innerHTML=`<div class="page-title"><div><h1>Payments</h1><p class="muted">Manual bKash/Nagad request → admin verification → approved receipt.</p></div></div>${state.user.role==='student'||state.user.role==='parent'?`<div class="card"><form class="form grid2" onsubmit="return makePayment(event)"><div class="field"><label>Student</label><select id="pstu">${(await api('/students')).map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.student_id)}</option>`).join('')}</select></div><div class="field"><label>Method</label><select id="pm"><option>bKash</option><option>Nagad</option></select></div><div class="field"><label>Transaction ID</label><input id="pt" required></div><div class="field"><label>Amount</label><input id="pa" type="number" min="1" step="0.01" required></div><div class="field"><label>Payer phone (optional)</label><input id="pp"></div><button class="btn">Submit Payment Request</button></form></div><br>`:''}<div class="card table-wrap"><table class="table"><thead><tr><th>Student</th><th>Method</th><th>Transaction</th><th>Amount</th><th>Status</th><th>Receipt</th><th>Action</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.student_name)}</td><td>${esc(p.method)}</td><td>${esc(p.transaction_id)}</td><td>${money(p.amount)}</td><td><span class="badge ${p.status==='APPROVED'?'ok':p.status==='REJECTED'?'danger':'warn'}">${p.status}</span></td><td>${esc(p.receipt_no||'—')}</td><td>${state.user.role==='admin'&&p.status==='PENDING'?`<button class="btn ok sm" onclick="approvePayment(${p.id})">Approve</button> <button class="btn danger sm" onclick="rejectPayment(${p.id})">Reject</button>`:p.status==='APPROVED'?`<button class="btn alt sm" onclick="printReceipt(${p.id})">Receipt</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No payment records.</td></tr>'}</tbody></table></div>`}
async function makePayment(e){e.preventDefault();try{await api('/payments',{method:'POST',body:JSON.stringify({student_id:$('pstu').value,method:$('pm').value,transaction_id:$('pt').value,amount:$('pa').value,payer_phone:$('pp').value})});toast('Payment request submitted as PENDING');payments($('main'))}catch(e){toast(e.message)}return false}
async function approvePayment(id){try{await api('/payments/'+id,{method:'PATCH',body:JSON.stringify({status:'APPROVED'})});toast('Payment approved');payments($('main'))}catch(e){toast(e.message)}}async function rejectPayment(id){const reason=prompt('Reject reason:');if(reason===null)return;try{await api('/payments/'+id,{method:'PATCH',body:JSON.stringify({status:'REJECTED',reason})});toast('Payment rejected');payments($('main'))}catch(e){toast(e.message)}}
async function printReceipt(id){const ps=await api('/payments');const p=ps.find(x=>x.id===id);if(!p)return;const w=window.open('','_blank');w.document.write(`<html><head><title>Receipt ${esc(p.receipt_no)}</title></head><body style="font-family:Arial;padding:30px"><h1>Student Care Academy</h1><p>Digital Payment Receipt</p><hr><p><b>Receipt:</b> ${esc(p.receipt_no||'')}</p><p><b>Student:</b> ${esc(p.student_name)}</p><p><b>Method:</b> ${esc(p.method)}</p><p><b>Transaction:</b> ${esc(p.transaction_id)}</p><p><b>Amount:</b> ${money(p.amount)}</p><p><b>Status:</b> ${esc(p.status)}</p><button onclick="print()">Print / Save PDF</button></body></html>`);w.document.close()}
async function routines(m){const rs=await api('/routines');m.innerHTML=`<div class="page-title"><div><h1>Class & Exam Routine</h1><p class="muted">Private authenticated routines.</p></div></div>${state.user.role==='admin'||state.user.role==='teacher'?`<div class="card"><form class="form" onsubmit="return addRoutine(event)"><div class="row"><select id="rty"><option>CLASS</option><option>EXAM</option></select><input id="rtit" class="grow" placeholder="Title" required></div><textarea id="rcon" placeholder="Routine content / timetable details" required></textarea><div class="row"><button class="btn">Publish Routine</button></div></form></div><br>`:''}${rs.map(r=>`<div class="card"><div class="row"><h3 class="grow">${esc(r.title)}</h3><span class="badge">${esc(r.type)}</span></div><p>${esc(r.content)}</p><p class="muted small">${r.class_no?'Class '+esc(r.class_no):'All classes'}${r.section_name?' · Section '+esc(r.section_name):''}</p></div>`).join('')||'<div class="card empty">No routine published.</div>'}`}
async function addRoutine(e){e.preventDefault();try{await api('/routines',{method:'POST',body:JSON.stringify({type:$('rty').value,title:$('rtit').value,content:$('rcon').value,published:true})});toast('Routine published');routines($('main'))}catch(e){toast(e.message)}return false}
async function notices(m){const ns=await api('/notices');const cs=state.cache.classes||(state.cache.classes=await api('/classes'));m.innerHTML=`<div class="page-title"><div><h1>Notice Management</h1><p class="muted">Private notices with target + expiry + publish status.</p></div></div>${state.user.role==='admin'||state.user.role==='teacher'?`<div class="card"><form class="form" onsubmit="return addNotice(event)"><div class="form grid2"><div class="field"><label>Title</label><input id="nt" required></div><div class="field"><label>Category</label><input id="ncg" value="General"></div><div class="field"><label>Publish date</label><input id="npd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Expiry date</label><input id="nex" type="date"></div><div class="field"><label>Target</label><select id="nty"><option value="ALL">All Students/Parents/Teachers</option><option value="PARENT">All Parents</option><option value="TEACHER">All Teachers</option><option value="CLASS">Specific Class</option><option value="SECTION">Specific Section</option><option value="STUDENT">Specific Student</option></select></div><div class="field"><label>Target value (ID when needed)</label><input id="ntv" placeholder="Class/Section/Student ID"></div></div><div class="field"><label>Content</label><textarea id="nct" required></textarea></div><div class="row"><select id="nst"><option>PUBLISHED</option><option>DRAFT</option><option>UNPUBLISHED</option></select><button class="btn">Save Notice</button></div></form></div><br>`:''}${ns.map(n=>`<div class="card notice-card"><div class="row"><h3 class="grow">${esc(n.title)}</h3><span class="badge ${n.status==='PUBLISHED'?'ok':n.status==='EXPIRED'?'danger':'warn'}">${esc(n.status)}</span></div><p>${esc(n.content)}</p><div class="small muted">${esc(n.category)} · Target: ${esc(n.target_type)} ${esc(n.target_value||'')} · Expiry: ${esc(n.expiry_date||'none')} · Author: ${esc(n.author||'System')}</div>${state.user.role==='admin'?`<br><button class="btn danger sm" onclick="deleteNotice(${n.id})">Delete</button>`:''}</div>`).join('')||'<div class="card empty">No notices.</div>'}`}
async function addNotice(e){e.preventDefault();try{await api('/notices',{method:'POST',body:JSON.stringify({title:$('nt').value,content:$('nct').value,category:$('ncg').value,publish_date:$('npd').value,expiry_date:$('nex').value,target_type:$('nty').value,target_value:$('ntv').value,status:$('nst').value})});toast('Notice saved');notices($('main'))}catch(e){toast(e.message)}return false}async function deleteNotice(id){if(!confirm('Delete this notice?'))return;try{await api('/notices/'+id,{method:'DELETE'});notices($('main'))}catch(e){toast(e.message)}}
async function notifications(m){const ns=await api('/notifications');m.innerHTML=`<div class="page-title"><div><h1>Notifications</h1><p class="muted">Read/unread communication center.</p></div><button class="btn alt" onclick="readAll()">Mark all read</button></div>${ns.map(n=>`<div class="card"><div class="row"><h3 class="grow">${esc(n.title)}</h3>${n.read?'<span class="badge ok">Read</span>':'<span class="badge warn">Unread</span>'}</div><p>${esc(n.message)}</p><div class="small muted">${esc(n.created_at)}</div>${!n.read?`<br><button class="btn alt sm" onclick="readNotif(${n.id})">Mark read</button>`:''}</div>`).join('')||'<div class="card empty">No notifications.</div>'}`}
async function readNotif(id){await api('/notifications/'+id+'/read',{method:'PATCH'});notifications($('main'))}async function readAll(){await api('/notifications/read-all',{method:'PATCH'});notifications($('main'))}
async function materials(m){const ms=await api('/materials');m.innerHTML=`<div class="page-title"><h1>Study Materials</h1></div>${state.user.role==='admin'||state.user.role==='teacher'?`<div class="card"><form class="form grid2" onsubmit="return addMaterial(event)"><input id="mt" placeholder="Title" required><input id="mu" placeholder="URL" required><input id="md" placeholder="Description"><button class="btn">Add Material</button></form></div><br>`:''}<div class="grid3">${ms.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description||'')}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">Open material</a></div>`).join('')||'<div class="card empty">No materials.</div>'}</div>`}
async function addMaterial(e){e.preventDefault();try{await api('/materials',{method:'POST',body:JSON.stringify({title:$('mt').value,description:$('md').value,url:$('mu').value,published:true})});toast('Material added');materials($('main'))}catch(e){toast(e.message)}return false}
async function assignments(m){const as=await api('/assignments');m.innerHTML=`<div class="page-title"><h1>Assignments</h1></div>${state.user.role==='admin'||state.user.role==='teacher'?`<div class="card"><form class="form grid2" onsubmit="return addAssignment(event)"><input id="at" placeholder="Title" required><input id="ad" type="date"><textarea id="ax" placeholder="Description"></textarea><button class="btn">Create Assignment</button></form></div><br>`:''}<div class="grid3">${as.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><div class="small muted">Due: ${esc(x.due_date||'No date')}</div></div>`).join('')||'<div class="card empty">No assignments.</div>'}</div>`}
async function addAssignment(e){e.preventDefault();try{await api('/assignments',{method:'POST',body:JSON.stringify({title:$('at').value,description:$('ax').value,due_date:$('ad').value,published:true})});toast('Assignment created');assignments($('main'))}catch(e){toast(e.message)}return false}
async function report(m){const r=await api('/report');m.innerHTML=`<div class="page-title"><div><h1>Academy Report</h1><p class="muted">Collection, due, attendance and result summary.</p></div><button class="btn alt" onclick="window.print()">Print / Save PDF</button></div><div class="grid">${[['Total Students',r.students],['Active Students',r.activeStudents],['Teachers',r.teachers],['Parents',r.parents],['Total Due',money(r.due)],['Approved Collection',money(r.approved)],['Pending Payments',money(r.pending)],['Rejected Payments',money(r.rejected)],['Today Collection',money(r.today)],['7 Day Collection',money(r.last7)],['30 Day Collection',money(r.last30)],['Published Results',r.publishedResults]].map(x=>`<div class="card"><div class="muted small">${esc(x[0])}</div><div class="stat">${esc(x[1])}</div></div>`).join('')}</div><br><div class="grid3"><div class="card"><h3>Attendance</h3><div class="stat">${r.attendanceTotal?Math.round((r.attendancePresent/r.attendanceTotal)*100):0}%</div><p class="muted">Based on saved attendance records.</p></div><div class="card"><h3>Payment flow</h3><p class="muted">PENDING → Admin verifies → APPROVED/REJECTED. Approved payments reduce due and generate a receipt.</p></div><div class="card"><h3>Security</h3><p class="muted">Authenticated routes, session cookies, role checks, server-side fee/payment logic, private result-card images.</p></div></div>`}
async function auditPage(m){const a=await api('/audit-logs');m.innerHTML=`<div class="page-title"><h1>Audit Logs</h1></div><div class="card table-wrap"><table class="table"><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.user_name||'System')}</td><td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No logs.</td></tr>'}</tbody></table></div>`}
boot();
</script></body></html>
